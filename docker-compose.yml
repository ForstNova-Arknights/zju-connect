# zju-connect 容器化部署 —— 上海海洋大学 aTrust
#
#   mkdir -p state
#   cp config.example.toml config.toml && chmod 600 config.toml
#   $EDITOR config.toml
#   docker compose up -d
#   docker compose logs -f
#
# 板子（armv7）走南大镜像源，比直连 ghcr.io 稳：
#   ghcr.nju.edu.cn/forstnova-arknights/zju-connect:latest

services:
  zju-connect:
    # 默认用 CI 发布的镜像；想从源码本地构建就把 image 换成下面两行
    image: ${ZJU_IMAGE:-ghcr.nju.edu.cn/forstnova-arknights/zju-connect:latest}
    # build:
    #   context: .

    container_name: zju-connect
    restart: unless-stopped

    # 用自定义网络。自定义网络才有 Docker 内嵌 DNS，容器之间可以用
    # 容器名互访（默认 bridge 只认 IP，不解析名字）。
    #
    # 名字显式写成 zju-connect-net，而不是让 compose 自动生成
    # zju-connect-docker_default —— 后者只有本项目这一个服务在里面，
    # 名字解析没有意义，而且项目目录改名就会变。
    #
    # 想让别的容器也能用 `zju-connect` 这个名字访问，把它们接进来即可：
    #   docker network connect zju-connect-net qinglong
    networks:
      - zju-connect-net

    ports:
      # ── SOCKS5 (1080) ────────────────────────────────────────────
      # 支持用户名密码鉴权，在 config.toml 里设 socks_user / socks_passwd。
      - "1080:1080"

      # ── HTTP 代理 (8888) ─────────────────────────────────────────
      # ⚠️ 上游的 HTTP 代理**没有鉴权**（ServeHTTP 不接受 user/password）。
      #    下面这行会把「通往校内网的代理」开放给整个局域网。
      #    单机自用请改成只绑回环：
      #        - "127.0.0.1:8888:8888"
      - "8888:8888"

    volumes:
      # 配置只读挂载 —— 里面有 CAS 密码和 TOTP 密钥
      - ./config.toml:/data/config.toml:ro

      # 会话状态持久化。client_data.json 等同凭据：
      # 登录成功后连密码 / TOTP 都不再需要，删了就要重新走一遍登录。
      - ./state:/data/state

    environment:
      - TZ=Asia/Shanghai

    # 纯用户态代理，不建 TUN、不改路由，所以不需要下面这些：
    #   cap_add: [NET_ADMIN]
    #   devices: ["/dev/net/tun:/dev/net/tun"]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  zju-connect-net:
    # 显式指定 name，避免 compose 加上项目名前缀
    name: zju-connect-net
    driver: bridge
