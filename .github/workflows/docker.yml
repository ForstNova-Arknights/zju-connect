name: Publish Docker image

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"
      - "Dockerfile"
      - ".dockerignore"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      # 本 Dockerfile 用 --platform=$BUILDPLATFORM 编译，理论上不需要 QEMU；
      # 但部分基础镜像（alpine 的运行层）仍会按目标平台拉取，装上更稳。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}

      - name: Prepare version info
        id: vars
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=dev
          COMMIT_ID="$(git rev-parse --short HEAD)"
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${RELEASE_TAG}"
            COMMIT_ID=
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_id=${COMMIT_ID}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 多架构清单。编译走 Go 原生交叉编译，不依赖 QEMU 模拟。
          # 想要更精简可以砍掉 ppc64le / s390x / riscv64。
          platforms: |
            linux/amd64
            linux/386
            linux/arm/v6
            linux/arm/v7
            linux/arm64
            linux/riscv64
            linux/ppc64le
            linux/s390x
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT_ID=${{ steps.vars.outputs.commit_id }}
          # 关掉 provenance / SBOM attestation：它们会在 manifest index 里
          # 多出 8 个 platform=unknown/unknown 的条目，部分镜像代理和旧版
          # Docker 处理不好。本项目用不上这些证明。
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
